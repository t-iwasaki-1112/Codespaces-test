tasks:
  - name: 環境構築とサーバー起動
    init: |
      npm install
      docker pull postgres:15-alpine
    command: |
      # PostgreSQLをDockerでバックグラウンド起動
      docker run -d --name postgres_db -e POSTGRES_USER=myuser -e POSTGRES_PASSWORD=mypassword -e POSTGRES_DB=mydb -p 5432:5432 postgres:15-alpine
      
      echo "DBの起動を待機しています..."
      sleep 5
      
      # Webサーバー起動
      npm start
ports:
  - port: 3000
    onOpen: open-preview
  - port: 5432
    onOpen: ignore
